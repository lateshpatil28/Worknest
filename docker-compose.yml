version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: worknest_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worknest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worknest_secret}
      POSTGRES_DB: ${POSTGRES_DB:-worknest_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worknest} -d ${POSTGRES_DB:-worknest_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worknest_backend
    restart: unless-stopped
    environment:
      APP_NAME: WorkNest
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-worknest}:${POSTGRES_PASSWORD:-worknest_secret}@db:5432/${POSTGRES_DB:-worknest_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-worknest_production_jwt_super_secret_key_change_me_987654321}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      STORAGE_DIR: /app/storage
      MAX_UPLOAD_SIZE_MB: 50
      ALLOWED_EXTENSIONS: pdf,doc,docx,xls,xlsx,ppt,pptx,txt,md,png,jpg,jpeg,gif,zip,csv,json
      ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173,http://frontend
    volumes:
      - file_storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: worknest_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  file_storage:
